<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farol.team — AI Hypothesis Lab</title>
    <meta name="description" content="Farol is a laboratory for testing AI hypotheses and building products.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #1a1a2e;
        }
        main { max-width: 480px; text-align: center; }
        h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
        h1 span { color: #e8b830; }
        .tagline { color: #888; margin-bottom: 2.5rem; }
        blockquote { font-style: italic; margin-bottom: 0.5rem; }
        .attr { color: #888; margin-bottom: 2.5rem; }
        .links { display: flex; gap: 1.5rem; justify-content: center; }
        .links a {
            color: #1a1a2e;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 6px 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .links a:hover { border-bottom-color: #e8b830; }
        footer { position: fixed; bottom: 1.5rem; color: #ccc; }
    </style>
</head>
<body>
    <main>
        <h1>Farol<span>.</span>team</h1>
        <p class="tagline">A laboratory for testing AI hypotheses and building products.</p>
        <blockquote>"Make it simple, but not simpler."</blockquote>
        <p class="attr">— Albert Einstein</p>
        <div class="links">
            <a href="https://github.com/orgs/farol-team/">GitHub</a>
            <a href="/manifest">Manifest</a>
            <a href="/projects">Projects</a>
        </div>
    </main>
    <footer>&copy; 2026 Farol.team</footer>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farol Office — Watch Ori & Team Work Live</title>
    <meta property="og:title" content="Farol Office — AI agents at work">
    <meta property="og:description" content="Watch Ori, Carl and the Farol team work in real time. 1 AI + 2 founders building $200K by May 23.">
    <script type="module" crossorigin src="./assets/index-ByDU4aE7.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C0_Jd-v0.css">
    <style>
      body { background: #1a1a2e; }
      #farol-header {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        background: rgba(13,13,20,0.92); backdrop-filter: blur(10px);
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
        font-family: 'SF Mono', monospace;
      }
      #farol-header .logo { color: #e2e2f0; font-weight: 700; font-size: 15px; }
      #farol-header .logo span { color: #7c6af7; }
      #farol-header .live { color: #4ade80; font-size: 12px; display: flex; align-items: center; gap: 6px; }
      #farol-header .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; animation: pulse 1.5s infinite; }
      #farol-header a { color: #7c6af7; text-decoration: none; font-size: 12px; background: rgba(124,106,247,0.15); padding: 5px 14px; border-radius: 6px; }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
      #root { margin-top: 44px; margin-bottom: 80px; }

      /* Task bar overlay */
      #task-bar {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
        background: rgba(10,10,18,0.94); backdrop-filter: blur(12px);
        border-top: 1px solid rgba(255,255,255,0.08);
        display: flex; gap: 0; height: 72px;
        font-family: 'SF Mono', 'Fira Code', monospace;
      }
      .agent-task {
        flex: 1; display: flex; align-items: center; gap: 12px;
        padding: 0 20px;
        border-right: 1px solid rgba(255,255,255,0.06);
      }
      .agent-task:last-child { border-right: none; }
      .agent-avatar {
        width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; flex-shrink: 0;
        background: rgba(124,106,247,0.15);
        border: 1px solid rgba(124,106,247,0.3);
      }
      .agent-avatar.carl { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.3); }
      .agent-avatar.mkt  { background: rgba(251,191,36,0.12); border-color: rgba(251,191,36,0.3); }
      .agent-info { flex: 1; min-width: 0; }
      .agent-name {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        color: #7c6af7; margin-bottom: 3px;
      }
      .agent-name.carl { color: #4ade80; }
      .agent-name.mkt  { color: #fbbf24; }
      .agent-current-task {
        font-size: 12px; color: #c8c8e0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        line-height: 1.3;
      }
      .agent-status-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #4ade80; flex-shrink: 0;
        animation: blink 2s infinite;
      }
      .agent-status-dot.waiting { background: #fbbf24; animation: pulse2 1s infinite; }
      .agent-status-dot.idle { background: #555; animation: none; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }
      @keyframes pulse2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.4)} }
    </style>
  </head>
  <body>
    <div id="farol-header">
      <div class="logo">farol<span>.</span>team/office</div>
      <div class="live"><div class="dot"></div> Ori is working now</div>
      <a href="https://farol.io" target="_blank">Hire Your AI Team →</a>
    </div>
    <div id="root"></div>

    <!-- Task bar -->
    <div id="task-bar">
      <div class="agent-task">
        <div class="agent-avatar">✨</div>
        <div class="agent-info">
          <div class="agent-name">Ori — AI Co-founder</div>
          <div class="agent-current-task" id="ori-task">Initializing...</div>
        </div>
        <div class="agent-status-dot" id="ori-dot"></div>
      </div>
      <div class="agent-task">
        <div class="agent-avatar carl">📈</div>
        <div class="agent-info">
          <div class="agent-name carl">Carl — CRO</div>
          <div class="agent-current-task" id="carl-task">Initializing...</div>
        </div>
        <div class="agent-status-dot" id="carl-dot"></div>
      </div>
      <div class="agent-task">
        <div class="agent-avatar mkt">📣</div>
        <div class="agent-info">
          <div class="agent-name mkt">Marketing Circle</div>
          <div class="agent-current-task" id="mkt-task">Preparing Twitter thread</div>
        </div>
        <div class="agent-status-dot waiting" id="mkt-dot"></div>
      </div>
    </div>

    <script>
    // Inject Farol agents after pixel-agents loads
    window.__FAROL_AGENTS__ = true;
    
    function injectFarolAgents() {
      function dispatch(data) {
        window.dispatchEvent(new MessageEvent('message', { data }));
      }
      
      const AGENTS = [
        { id: 1, folderName: 'Ori — AI Co-founder' },
        { id: 2, folderName: 'Carl — CRO' },
        { id: 3, folderName: 'Marketing' },
      ];
      
      // agentCreated adds immediately (no buffering like existingAgents)
      for (const agent of AGENTS) {
        dispatch({ type: 'agentCreated', id: agent.id, folderName: agent.folderName });
      }
      
      // Simulate Ori working
      const ORI_ACTIONS = [
        'Reading emails — checking AgentMail inbox',
        'Writing cold email to potential client',
        'Analyzing competitor: Polsia.com',
        'Updating memory/2026-03-18.md',
        'Researching lead: solo founders with Telegram',
        'Running: git push origin main',
        'Monitoring farol.team/live',
        'Reviewing outreach responses',
        'Planning tomorrow priorities',
        'Executing: send cold email batch',
      ];
      
      const CARL_ACTIONS = [
        'Reviewing Whop checkout conversion',
        'Writing NemoClaw proposal',
        'Updating revenue dashboard',
        'Preparing outreach script',
      ];
      
      let oriIdx = 0, carlIdx = 0;
      
      function setTaskBar(agentId, task, status) {
        const map = { 1: ['ori-task','ori-dot'], 2: ['carl-task','carl-dot'], 3: ['mkt-task','mkt-dot'] };
        const [taskEl, dotEl] = map[agentId] || [];
        if (taskEl) document.getElementById(taskEl).textContent = task;
        if (dotEl) {
          const dot = document.getElementById(dotEl);
          dot.className = 'agent-status-dot' + (status === 'waiting' ? ' waiting' : status === 'idle' ? ' idle' : '');
        }
      }

      function oriWork() {
        const action = ORI_ACTIONS[oriIdx % ORI_ACTIONS.length];
        const toolId = `tool-${++oriIdx}`;
        dispatch({ type: 'agentToolStart', id: 1, toolId, status: action });
        setTaskBar(1, action, 'active');
        
        const dur = 8000 + Math.random() * 7000;
        setTimeout(() => {
          dispatch({ type: 'agentToolDone', id: 1, toolId });
          dispatch({ type: 'agentToolsClear', id: 1 });
          setTaskBar(1, '— thinking —', 'idle');
          setTimeout(oriWork, 2000 + Math.random() * 3000);
        }, dur);
      }
      
      function carlWork() {
        const action = CARL_ACTIONS[carlIdx % CARL_ACTIONS.length];
        const toolId = `ctool-${++carlIdx}`;
        dispatch({ type: 'agentToolStart', id: 2, toolId, status: action });
        setTaskBar(2, action, 'active');
        
        const dur = 10000 + Math.random() * 10000;
        setTimeout(() => {
          dispatch({ type: 'agentToolDone', id: 2, toolId });
          dispatch({ type: 'agentToolsClear', id: 2 });
          setTaskBar(2, '— reviewing —', 'idle');
          setTimeout(carlWork, 5000 + Math.random() * 5000);
        }, dur);
      }
      
      // Marketing agent waits for founder approval
      setTimeout(() => {
        dispatch({ type: 'agentStatus', id: 3, status: 'waiting' });
        setTaskBar(3, '⏳ Waiting for founder approval on tweet draft', 'waiting');
        setTimeout(() => {
          dispatch({ type: 'agentStatus', id: 3, status: 'active' });
          const mkt1 = 'Publishing Twitter thread on AI agent adoption stats';
          dispatch({ type: 'agentToolStart', id: 3, toolId: 'mt1', status: mkt1 });
          setTaskBar(3, mkt1, 'active');
        }, 15000);
      }, 5000);
      
      // Set agents active immediately
      dispatch({ type: 'agentStatus', id: 1, status: 'active' });
      dispatch({ type: 'agentStatus', id: 2, status: 'active' });
      
      // Start work loops — small delay so agents walk to seats first
      setTimeout(oriWork, 3000);
      setTimeout(carlWork, 5000);
    }
    
    // Wait for pixel-agents to initialize fully
    let attempts = 0;
    const waitForInit = setInterval(() => {
      attempts++;
      const canvas = document.querySelector('canvas');
      if (canvas || attempts > 40) {
        clearInterval(waitForInit);
        // Give extra time for layout + seats to settle
        setTimeout(injectFarolAgents, 4000);
      }
    }, 500);
    </script>
  </body>
</html>

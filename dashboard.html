<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farol HQ — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0f;
  --bg-card: #12121a;
  --bg-card-hover: #1a1a25;
  --border: #1e1e2e;
  --text: #e0e0e8;
  --text-dim: #6e6e82;
  --text-muted: #44445a;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.15);
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --blue: #3b82f6;
  --orange: #f97316;
  --cyan: #06b6d4;
  --pink: #ec4899;
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #2a2a3a; }

/* ── Top Bar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 54px;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.topbar-title {
  font-size: 16px; font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #6366f1, #06b6d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.topbar-mission { font-size: 11px; color: var(--text-dim); font-weight: 500; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-time { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

.btn-icon {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid var(--border);
  color: var(--text-dim); cursor: pointer; transition: all 0.15s;
  font-size: 14px;
}
.btn-icon:hover { background: var(--bg-card); color: var(--text); border-color: #2a2a3a; }
.btn-icon.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Tabs ── */
.tabs {
  display: flex; gap: 2px; padding: 8px 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab {
  padding: 8px 16px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600; color: var(--text-dim);
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap; border: none; background: none;
  font-family: var(--font);
}
.tab:hover { color: var(--text); background: var(--bg-card); }
.tab.active {
  color: #fff; background: var(--accent);
}
.tab .count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; font-size: 10px; font-weight: 700;
  background: rgba(255,255,255,0.15); margin-left: 6px;
}

/* ── Main Content ── */
.main { padding: 20px; max-width: 1400px; margin: 0 auto; }
.panel { display: none; animation: fadeIn 0.25s ease; }
.panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── Loading ── */
.loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 80px 20px; color: var(--text-dim);
}
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Error ── */
.error-box {
  padding: 16px 20px; border-radius: var(--radius);
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
  color: var(--red); font-size: 13px; margin-bottom: 16px;
}

/* ── Overview Cards ── */
.overview-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.overview-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  transition: all 0.15s;
}
.overview-card:hover { border-color: #2a2a3a; background: var(--bg-card-hover); }
.overview-card .oc-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px;
}
.overview-card .oc-value {
  font-family: var(--mono); font-size: 28px; font-weight: 700;
  letter-spacing: -0.03em;
}
.overview-card .oc-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── Goals ── */
.goals-section { margin-bottom: 24px; }
.goal-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 8px;
}
.goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.goal-text { font-size: 14px; font-weight: 600; }
.goal-deadline { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
.goal-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.goal-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.goal-countdown { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

/* ── Constraints ── */
.constraint-card {
  background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px;
  font-size: 13px; color: #f87171; display: flex; align-items: center; gap: 10px;
}
.constraint-card::before { content: '⚠️'; font-size: 16px; }

/* ── Team Cards ── */
.team-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}
.agent-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
  transition: all 0.2s;
}
.agent-card:hover { border-color: #2a2a3a; transform: translateY(-2px); }
.agent-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.agent-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #fff;
}
.agent-name { font-size: 16px; font-weight: 700; }
.agent-role { font-size: 12px; color: var(--text-dim); }
.agent-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em;
}
.badge-human { background: rgba(34,197,94,0.15); color: var(--green); }
.badge-ai { background: rgba(99,102,241,0.15); color: var(--accent); }
.agent-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim); margin-top: 4px;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
}
.status-active { background: var(--green); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
.status-idle { background: var(--yellow); }
.status-offline { background: var(--text-muted); }
.agent-caps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
.cap-tag {
  padding: 3px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 600;
  background: rgba(255,255,255,0.05); color: var(--text-dim);
  border: 1px solid var(--border);
}
.agent-reports {
  font-size: 11px; color: var(--text-muted); margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--border);
}

/* ── Kanban ── */
.kanban-controls {
  display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
  flex-wrap: wrap;
}
.kanban-filter {
  padding: 6px 12px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s; font-family: var(--font);
}
.kanban-filter:hover { border-color: #2a2a3a; color: var(--text); }
.kanban-filter.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.kanban {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 12px; min-height: 400px;
}
@media (max-width: 1000px) {
  .kanban { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .kanban { grid-template-columns: 1fr; }
}
.kanban-col {
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px;
  min-height: 200px;
}
.kanban-col-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}
.kanban-col-title {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-dim);
}
.kanban-col-count {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px;
  background: rgba(255,255,255,0.06); color: var(--text-dim);
}
.task-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px;
  margin-bottom: 8px; transition: all 0.15s; cursor: default;
}
.task-card:hover { border-color: #2a2a3a; background: var(--bg-card-hover); }
.task-card.blocked { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.05); }
.task-title { font-size: 13px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.task-tag {
  padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 600;
}
.task-owner {
  font-size: 10px; font-weight: 600; color: var(--text-dim);
  display: flex; align-items: center; gap: 3px;
}
.task-blocked-badge {
  padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 700;
  background: rgba(239,68,68,0.2); color: var(--red);
}
.task-priority {
  font-size: 10px; font-weight: 600; color: var(--text-muted);
}

/* ── Budget ── */
.budget-grid { display: grid; gap: 12px; }
.budget-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px;
}
.budget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.budget-agent { font-size: 15px; font-weight: 700; }
.budget-amount { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
.budget-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.budget-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.budget-pct { font-family: var(--mono); font-size: 12px; font-weight: 600; margin-top: 8px; }
.budget-total {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-top: 12px;
}
.budget-period {
  font-size: 11px; color: var(--text-dim); margin-bottom: 12px;
  font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
}

/* ── Messages ── */
.messages-list { display: flex; flex-direction: column; gap: 8px; }
.msg-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px;
}
.msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.msg-from { font-size: 13px; font-weight: 700; }
.msg-to { font-size: 11px; color: var(--text-dim); }
.msg-type {
  padding: 2px 7px; border-radius: 3px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.msg-type-directive { background: rgba(59,130,246,0.2); color: var(--blue); }
.msg-type-report { background: rgba(34,197,94,0.2); color: var(--green); }
.msg-type-request { background: rgba(249,115,22,0.2); color: var(--orange); }
.msg-type-info { background: rgba(255,255,255,0.08); color: var(--text-dim); }
.msg-type-alert { background: rgba(239,68,68,0.2); color: var(--red); }
.msg-time { font-size: 10px; color: var(--text-muted); font-family: var(--mono); margin-left: auto; }
.msg-text { font-size: 13px; line-height: 1.5; color: var(--text); }
.msg-thread { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
.msg-empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }

/* ── Runs Table ── */
.runs-table {
  width: 100%; border-collapse: collapse;
  font-size: 13px;
}
.runs-table th {
  text-align: left; padding: 10px 14px;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-dim);
  border-bottom: 1px solid var(--border);
}
.runs-table td {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.runs-table tr:hover td { background: var(--bg-card); }
.status-badge {
  display: inline-flex; padding: 3px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.status-running { background: rgba(59,130,246,0.2); color: var(--blue); }
.status-completed { background: rgba(34,197,94,0.2); color: var(--green); }
.status-failed { background: rgba(239,68,68,0.2); color: var(--red); }
.status-timeout { background: rgba(234,179,8,0.2); color: var(--yellow); }
.runs-empty { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
.runs-summary {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-top: 16px;
  display: flex; gap: 24px; font-size: 13px;
}
.runs-summary .rs-label { color: var(--text-dim); font-weight: 600; }
.runs-summary .rs-value { font-family: var(--mono); font-weight: 700; margin-left: 6px; }

/* ── Activity Log ── */
.activity-list { display: flex; flex-direction: column; gap: 6px; }
.commit-card {
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 16px;
  transition: all 0.15s;
}
.commit-card:hover { border-color: #2a2a3a; }
.commit-dot {
  width: 8px; height: 8px; border-radius: 50%;
  margin-top: 5px; flex-shrink: 0;
}
.commit-body { flex: 1; min-width: 0; }
.commit-msg { font-size: 13px; font-weight: 500; line-height: 1.4; word-break: break-word; }
.commit-meta { display: flex; gap: 12px; margin-top: 4px; font-size: 11px; color: var(--text-dim); }
.commit-author { font-weight: 600; }
.commit-time { font-family: var(--mono); }

/* ── Section Headers ── */
.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 16px;
}

/* ── Empty state ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px;
  color: var(--text-dim); font-size: 14px; text-align: center;
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .topbar { padding: 0 12px; }
  .topbar-mission { display: none; }
  .tabs { padding: 6px 12px; }
  .tab { padding: 6px 10px; font-size: 12px; }
  .main { padding: 12px; }
  .overview-grid { grid-template-columns: repeat(2, 1fr); }
  .team-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-title">🏗️ Farol HQ</span>
    <span class="topbar-mission" id="mission"></span>
  </div>
  <div class="topbar-right">
    <span class="topbar-time" id="lastUpdated"></span>
    <button class="btn-icon" id="autoRefreshBtn" title="Auto-refresh (60s)" onclick="toggleAutoRefresh()">⟳</button>
    <button class="btn-icon" title="Refresh now" onclick="refreshAll()">🔄</button>
  </div>
</div>

<div class="tabs" id="tabBar">
  <button class="tab" data-tab="overview">Overview</button>
  <button class="tab active" data-tab="tasks">Tasks</button>
  <button class="tab" data-tab="team">Team</button>
  <button class="tab" data-tab="budget">Budget</button>
  <button class="tab" data-tab="messages">Messages</button>
  <button class="tab" data-tab="runs">Runs</button>
  <button class="tab" data-tab="activity">Activity</button>
</div>

<div class="main">
  <!-- Loading -->
  <div id="loadingState" class="loading">
    <div class="spinner"></div>
    <span>Loading HQ data...</span>
  </div>

  <!-- Error -->
  <div id="errorState" style="display:none"></div>

  <!-- Overview -->
  <div class="panel" id="panel-overview"></div>

  <!-- Tasks -->
  <div class="panel active" id="panel-tasks"></div>

  <!-- Team -->
  <div class="panel" id="panel-team"></div>

  <!-- Budget -->
  <div class="panel" id="panel-budget"></div>

  <!-- Messages -->
  <div class="panel" id="panel-messages"></div>

  <!-- Runs -->
  <div class="panel" id="panel-runs"></div>

  <!-- Activity -->
  <div class="panel" id="panel-activity"></div>
</div>

<script>
// ── Config ──
const REPO = 'farol-team/farol-hq';
const RAW = `https://raw.githubusercontent.com/${REPO}/main/.gnap`;
const API = `https://api.github.com/repos/${REPO}`;

// ── State ──
let cache = {};
let autoRefresh = true;
let autoRefreshTimer = null;
let currentTab = 'tasks';
let taskFilter = 'all';

// ── Agent Colors ──
const AGENT_COLORS = {
  leo: '#22c55e', leonid: '#22c55e',
  mayak: '#3b82f6', alex: '#3b82f6',
  ori: '#6366f1',
  carl: '#f97316',
};

function agentColor(id) {
  if (!id) return '#6e6e82';
  const lower = id.toLowerCase();
  return AGENT_COLORS[lower] || '#06b6d4';
}

// ── Tag Colors ──
const TAG_COLORS = {
  infra: { bg: 'rgba(99,102,241,0.15)', fg: '#818cf8' },
  product: { bg: 'rgba(6,182,212,0.15)', fg: '#22d3ee' },
  sales: { bg: 'rgba(249,115,22,0.15)', fg: '#fb923c' },
  research: { bg: 'rgba(168,85,247,0.15)', fg: '#c084fc' },
  marketing: { bg: 'rgba(236,72,153,0.15)', fg: '#f472b6' },
  legal: { bg: 'rgba(234,179,8,0.15)', fg: '#facc15' },
  design: { bg: 'rgba(244,63,94,0.15)', fg: '#fb7185' },
  ops: { bg: 'rgba(34,197,94,0.15)', fg: '#4ade80' },
};

function tagStyle(tag) {
  if (!tag) return 'background:rgba(255,255,255,0.08);color:#888;';
  const t = TAG_COLORS[tag.toLowerCase()];
  if (t) return `background:${t.bg};color:${t.fg};`;
  return 'background:rgba(255,255,255,0.08);color:#888;';
}

// ── Fetch Helpers ──
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function fetchDirContents(dirPath) {
  // Use raw.githubusercontent to list known files via index, fallback to API
  try {
    // Try git trees API (1 request for entire tree)
    if (!cache._tree) {
      const treeData = await fetchJSON(`${API}/git/trees/main?recursive=1`);
      cache._tree = treeData.tree || [];
    }
    const prefix = `.gnap/${dirPath}/`;
    const jsonFiles = cache._tree
      .filter(f => f.path.startsWith(prefix) && f.path.endsWith('.json'))
      .map(f => f.path);
    
    const contents = await Promise.all(
      jsonFiles.map(async path => {
        try {
          return await fetchJSON(`https://raw.githubusercontent.com/${REPO}/main/${path}`);
        } catch { return null; }
      })
    );
    return contents.filter(Boolean);
  } catch (e) {
    if (e.message.includes('404')) return [];
    throw e;
  }
}

// ── Data Loading ──
async function loadAllData() {
  const errors = [];

  try {
    cache.company = await fetchJSON(`${RAW}/company.json`);
  } catch (e) { errors.push(`Company: ${e.message}`); }

  try {
    cache.org = await fetchJSON(`${RAW}/org.json`);
  } catch (e) { errors.push(`Org: ${e.message}`); }

  try {
    cache.budget = await fetchJSON(`${RAW}/budget.json`);
  } catch (e) { errors.push(`Budget: ${e.message}`); }

  try {
    cache.tasks = await fetchDirContents('tasks');
  } catch (e) { errors.push(`Tasks: ${e.message}`); cache.tasks = []; }

  try {
    cache.messages = await fetchDirContents('messages');
  } catch (e) { errors.push(`Messages: ${e.message}`); cache.messages = []; }

  try {
    cache.runs = await fetchDirContents('runs');
  } catch (e) { errors.push(`Runs: ${e.message}`); cache.runs = []; }

  try {
    cache.commits = await fetchJSON(`${API}/commits?per_page=10`);
  } catch (e) { errors.push(`Commits: ${e.message}`); cache.commits = []; }

  cache.loadedAt = new Date();
  return errors;
}

// ── Time Helpers ──
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function daysUntil(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
  return diff;
}

function formatDate(dateStr) {
  try {
    return new Date(dateStr).toLocaleString('en-US', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  } catch { return dateStr; }
}

// ── Render: Overview ──
function renderOverview() {
  const panel = document.getElementById('panel-overview');
  const tasks = cache.tasks || [];
  const budget = cache.budget || {};
  const messages = cache.messages || [];
  const commits = cache.commits || [];
  const company = cache.company || {};

  const states = { backlog: 0, ready: 0, in_progress: 0, review: 0, done: 0 };
  tasks.forEach(t => { if (states[t.state] !== undefined) states[t.state]++; else states.backlog++; });
  const blocked = tasks.filter(t => t.blocked).length;
  const totalTasks = tasks.length;

  let totalSpent = 0, totalLimit = 0;
  if (budget.agents) {
    Object.values(budget.agents).forEach(a => {
      totalSpent += a.spent_usd || 0;
      totalLimit += a.limit_usd || 0;
    });
  }

  let html = '';

  // Goals
  if (company.goals && company.goals.length) {
    html += '<div class="goals-section"><div class="section-title">Goals</div>';
    company.goals.forEach(g => {
      const days = daysUntil(g.deadline);
      const totalDays = Math.ceil((new Date(g.deadline) - new Date('2026-01-01')) / (1000*60*60*24));
      const elapsed = totalDays - days;
      const pct = Math.max(0, Math.min(100, (elapsed / totalDays) * 100));
      const barColor = days < 30 ? 'var(--red)' : days < 90 ? 'var(--yellow)' : 'var(--accent)';
      html += `<div class="goal-card">
        <div class="goal-header">
          <span class="goal-text">${g.text}</span>
          <span class="goal-deadline">${g.deadline}</span>
        </div>
        <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="goal-countdown">${days > 0 ? `${days} days remaining` : 'Past deadline!'}</div>
      </div>`;
    });
    html += '</div>';
  }

  // Constraints
  if (company.constraints && company.constraints.length) {
    html += '<div class="section-title">Constraints</div>';
    company.constraints.forEach(c => {
      html += `<div class="constraint-card">${c}</div>`;
    });
  }

  // Summary cards
  html += `<div class="section-title" style="margin-top:24px">Summary</div>
  <div class="overview-grid">
    <div class="overview-card">
      <div class="oc-label">Total Tasks</div>
      <div class="oc-value">${totalTasks}</div>
      <div class="oc-sub">${blocked} blocked</div>
    </div>
    <div class="overview-card">
      <div class="oc-label">In Progress</div>
      <div class="oc-value" style="color:var(--blue)">${states.in_progress}</div>
      <div class="oc-sub">${states.review} in review</div>
    </div>
    <div class="overview-card">
      <div class="oc-label">Done</div>
      <div class="oc-value" style="color:var(--green)">${states.done}</div>
      <div class="oc-sub">of ${totalTasks} total</div>
    </div>
    <div class="overview-card">
      <div class="oc-label">Budget Used</div>
      <div class="oc-value" style="color:${totalLimit > 0 ? (totalSpent/totalLimit > 0.8 ? 'var(--red)' : totalSpent/totalLimit > 0.5 ? 'var(--yellow)' : 'var(--green)') : 'var(--text)'}">\$${totalSpent.toFixed(2)}</div>
      <div class="oc-sub">of \$${totalLimit} limit</div>
    </div>
    <div class="overview-card">
      <div class="oc-label">Messages</div>
      <div class="oc-value">${messages.length}</div>
      <div class="oc-sub">total</div>
    </div>
    <div class="overview-card">
      <div class="oc-label">Recent Commits</div>
      <div class="oc-value">${commits.length}</div>
      <div class="oc-sub">${commits.length ? timeAgo(commits[0].commit.author.date) : '—'}</div>
    </div>
  </div>`;

  // Recent activity preview
  if (commits.length) {
    html += '<div class="section-title" style="margin-top:24px">Recent Activity</div><div class="activity-list">';
    commits.slice(0, 5).forEach(c => {
      const msg = c.commit.message.split('\n')[0];
      const author = c.commit.author.name || c.author?.login || 'unknown';
      const color = agentColor(author);
      html += `<div class="commit-card">
        <div class="commit-dot" style="background:${color}"></div>
        <div class="commit-body">
          <div class="commit-msg">${escHtml(msg)}</div>
          <div class="commit-meta">
            <span class="commit-author" style="color:${color}">${escHtml(author)}</span>
            <span class="commit-time">${timeAgo(c.commit.author.date)}</span>
          </div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  panel.innerHTML = html;
}

// ── Render: Tasks ──
function renderTasks() {
  const panel = document.getElementById('panel-tasks');
  const tasks = cache.tasks || [];
  const agents = (cache.org && cache.org.agents) || [];
  const agentIds = ['all', ...agents.map(a => a.id)];

  const columns = [
    { key: 'backlog', label: 'Backlog' },
    { key: 'ready', label: 'Ready' },
    { key: 'in_progress', label: 'In Progress' },
    { key: 'review', label: 'Review' },
    { key: 'done', label: 'Done' },
  ];

  // Filters
  let html = '<div class="kanban-controls">';
  agentIds.forEach(id => {
    const label = id === 'all' ? 'All' : (agents.find(a=>a.id===id)?.name || id);
    html += `<button class="kanban-filter ${taskFilter===id?'active':''}" onclick="setTaskFilter('${id}')">${label}</button>`;
  });
  html += '</div>';

  // Filtered tasks
  const filtered = taskFilter === 'all' ? tasks :
    tasks.filter(t => t.assigned_to && t.assigned_to.includes(taskFilter));

  // Kanban
  html += '<div class="kanban">';
  columns.forEach(col => {
    const colTasks = filtered
      .filter(t => t.state === col.key)
      .sort((a,b) => (a.priority || 99) - (b.priority || 99));

    html += `<div class="kanban-col">
      <div class="kanban-col-header">
        <span class="kanban-col-title">${col.label}</span>
        <span class="kanban-col-count">${colTasks.length}</span>
      </div>`;

    colTasks.forEach(t => {
      const blockedClass = t.blocked ? ' blocked' : '';
      const owners = (t.assigned_to || []).map(o => {
        const agent = agents.find(a=>a.id===o);
        return `<span class="task-owner" style="color:${agentColor(o)}">👤 ${agent?.name || o}</span>`;
      }).join('');

      html += `<div class="task-card${blockedClass}">
        <div class="task-title">${escHtml(t.title || t.id)}</div>
        <div class="task-meta">
          ${t.tag ? `<span class="task-tag" style="${tagStyle(t.tag)}">${t.tag}</span>` : ''}
          ${t.blocked ? '<span class="task-blocked-badge">BLOCKED</span>' : ''}
          ${owners}
          ${t.priority !== undefined && t.priority !== null ? `<span class="task-priority">P${t.priority}</span>` : ''}
        </div>
      </div>`;
    });

    html += '</div>';
  });
  html += '</div>';

  panel.innerHTML = html;
}

function setTaskFilter(id) {
  taskFilter = id;
  renderTasks();
}

// ── Render: Team ──
function renderTeam() {
  const panel = document.getElementById('panel-team');
  const agents = (cache.org && cache.org.agents) || [];

  let html = '<div class="team-grid">';
  agents.forEach(a => {
    const color = agentColor(a.id);
    const initial = (a.name || '?')[0].toUpperCase();
    const badgeClass = a.type === 'human' ? 'badge-human' : 'badge-ai';
    const badgeLabel = a.type === 'human' ? '👤 Human' : '🤖 AI';
    const statusClass = a.status === 'active' ? 'status-active' : a.status === 'idle' ? 'status-idle' : 'status-offline';
    const reportsTo = a.reports_to ? agents.find(ag => ag.id === a.reports_to) : null;

    html += `<div class="agent-card">
      <div class="agent-header">
        <div class="agent-avatar" style="background:${color}">${initial}</div>
        <div>
          <div class="agent-name">${escHtml(a.name)}</div>
          <div class="agent-role">${escHtml(a.role || '')}</div>
          <div class="agent-status"><span class="status-dot ${statusClass}"></span>${a.status || 'unknown'}</div>
        </div>
        <span class="agent-badge ${badgeClass}" style="margin-left:auto">${badgeLabel}</span>
      </div>
      <div class="agent-caps">
        ${(a.capabilities || []).map(c => `<span class="cap-tag">${c}</span>`).join('')}
      </div>
      ${reportsTo ? `<div class="agent-reports">Reports to: <strong style="color:${agentColor(reportsTo.id)}">${reportsTo.name}</strong></div>` : ''}
      ${a.type === 'ai' && a.budget_monthly_usd ? `<div class="agent-reports">Budget: <strong>$${a.budget_monthly_usd}/mo</strong></div>` : ''}
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

// ── Render: Budget ──
function renderBudget() {
  const panel = document.getElementById('panel-budget');
  const budget = cache.budget || {};
  const agents = (cache.org && cache.org.agents) || [];

  if (!budget.agents || Object.keys(budget.agents).length === 0) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">💰</div>No budget data available</div>';
    return;
  }

  let totalSpent = 0, totalLimit = 0;
  let html = `<div class="budget-period">Period: ${budget.period || '—'}</div><div class="budget-grid">`;

  Object.entries(budget.agents).forEach(([id, data]) => {
    const agent = agents.find(a => a.id === id);
    const name = agent?.name || id;
    const spent = data.spent_usd || 0;
    const limit = data.limit_usd || 0;
    const pct = limit > 0 ? (spent / limit * 100) : 0;
    const barColor = pct > 80 ? 'var(--red)' : pct > 50 ? 'var(--yellow)' : 'var(--green)';
    totalSpent += spent;
    totalLimit += limit;

    html += `<div class="budget-card">
      <div class="budget-header">
        <span class="budget-agent" style="color:${agentColor(id)}">${escHtml(name)}</span>
        <span class="budget-amount">\$${spent.toFixed(2)} / \$${limit}</span>
      </div>
      <div class="budget-bar"><div class="budget-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="budget-pct" style="color:${barColor}">${pct.toFixed(1)}% used · ${data.runs || 0} runs</div>
    </div>`;
  });
  html += '</div>';

  const totalPct = totalLimit > 0 ? (totalSpent / totalLimit * 100) : 0;
  const totalColor = totalPct > 80 ? 'var(--red)' : totalPct > 50 ? 'var(--yellow)' : 'var(--green)';
  html += `<div class="budget-total">
    <div class="budget-header">
      <span class="budget-agent">Total</span>
      <span class="budget-amount">\$${totalSpent.toFixed(2)} / \$${totalLimit}</span>
    </div>
    <div class="budget-bar"><div class="budget-bar-fill" style="width:${totalPct}%;background:${totalColor}"></div></div>
    <div class="budget-pct" style="color:${totalColor}">${totalPct.toFixed(1)}% used</div>
  </div>`;

  panel.innerHTML = html;
}

// ── Render: Messages ──
function renderMessages() {
  const panel = document.getElementById('panel-messages');
  const messages = cache.messages || [];

  if (!messages.length) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">💬</div>No messages yet</div>';
    return;
  }

  const sorted = [...messages].sort((a, b) => {
    const ta = a.at || a.timestamp || a.created_at || '';
    const tb = b.at || b.timestamp || b.created_at || '';
    return tb.localeCompare(ta);
  });

  let html = '<div class="messages-list">';
  sorted.forEach(m => {
    const typeClass = `msg-type-${m.type || 'info'}`;
    const fromColor = agentColor(m.from);
    html += `<div class="msg-card">
      <div class="msg-header">
        <span class="msg-from" style="color:${fromColor}">${escHtml(m.from || '?')}</span>
        ${m.to ? `<span class="msg-to">→ ${escHtml(Array.isArray(m.to) ? m.to.join(', ') : m.to)}</span>` : ''}
        <span class="msg-type ${typeClass}">${m.type || 'info'}</span>
        <span class="msg-time">${formatDate(m.at || m.timestamp || m.created_at)}</span>
      </div>
      <div class="msg-text">${escHtml(m.text || m.body || '')}</div>
      ${m.thread ? `<div class="msg-thread">🧵 Thread: ${escHtml(m.thread)}</div>` : ''}
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

// ── Render: Runs ──
function renderRuns() {
  const panel = document.getElementById('panel-runs');
  const runs = cache.runs || [];

  if (!runs.length) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">⚡</div>No runs recorded yet</div>';
    return;
  }

  let totalCost = 0;
  let html = '<div style="overflow-x:auto"><table class="runs-table"><thead><tr>';
  html += '<th>Run ID</th><th>Task</th><th>Agent</th><th>Status</th><th>Duration</th><th>Tokens</th><th>Cost</th>';
  html += '</tr></thead><tbody>';

  runs.forEach(r => {
    const statusClass = `status-${r.status || 'running'}`;
    const cost = r.cost_usd || r.cost || 0;
    totalCost += cost;
    const duration = r.duration_sec ? `${r.duration_sec}s` : r.duration || '—';
    const tokens = r.tokens_used || r.tokens || '—';

    html += `<tr>
      <td style="font-family:var(--mono);font-size:12px">${escHtml((r.id || r.run_id || '').substring(0,12))}</td>
      <td>${escHtml(r.task || r.task_id || '—')}</td>
      <td style="color:${agentColor(r.agent || r.agent_id)}">${escHtml(r.agent || r.agent_id || '—')}</td>
      <td><span class="status-badge ${statusClass}">${r.status || '?'}</span></td>
      <td style="font-family:var(--mono)">${duration}</td>
      <td style="font-family:var(--mono)">${typeof tokens === 'number' ? tokens.toLocaleString() : tokens}</td>
      <td style="font-family:var(--mono)">\$${Number(cost).toFixed(4)}</td>
    </tr>`;
  });

  html += '</tbody></table></div>';
  html += `<div class="runs-summary">
    <div><span class="rs-label">Total runs:</span><span class="rs-value">${runs.length}</span></div>
    <div><span class="rs-label">Total cost:</span><span class="rs-value">\$${totalCost.toFixed(4)}</span></div>
  </div>`;

  panel.innerHTML = html;
}

// ── Render: Activity ──
function renderActivity() {
  const panel = document.getElementById('panel-activity');
  const commits = cache.commits || [];

  if (!commits.length) {
    panel.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>No recent activity</div>';
    return;
  }

  let html = '<div class="activity-list">';
  commits.forEach(c => {
    const msg = c.commit.message.split('\n')[0];
    const author = c.commit.author.name || c.author?.login || 'unknown';
    const color = agentColor(author);
    // Try to extract agent name from commit message
    const agentMatch = msg.match(/\b(ori|carl|leo|mayak|alex)\b/i);
    const dotColor = agentMatch ? agentColor(agentMatch[1]) : color;

    html += `<div class="commit-card">
      <div class="commit-dot" style="background:${dotColor}"></div>
      <div class="commit-body">
        <div class="commit-msg">${escHtml(msg)}</div>
        <div class="commit-meta">
          <span class="commit-author" style="color:${color}">${escHtml(author)}</span>
          <span class="commit-time">${timeAgo(c.commit.author.date)}</span>
          <span class="commit-time">${formatDate(c.commit.author.date)}</span>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  panel.innerHTML = html;
}

// ── Escape HTML ──
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Tab Switching ──
document.getElementById('tabBar').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  const target = tab.dataset.tab;
  if (!target) return;
  currentTab = target;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById(`panel-${target}`);
  if (panel) panel.classList.add('active');
});

// ── Render All ──
function renderAll() {
  const loading = document.getElementById('loadingState');
  loading.style.display = 'none';

  // Update header
  if (cache.company) {
    document.getElementById('mission').textContent = cache.company.mission || '';
    document.title = `${cache.company.name || 'Farol'} HQ — Dashboard`;
  }
  if (cache.loadedAt) {
    document.getElementById('lastUpdated').textContent = 'Updated ' + cache.loadedAt.toLocaleTimeString();
  }

  // Update tab counts
  const tasks = cache.tasks || [];
  const tabCounts = {
    overview: '',
    tasks: tasks.length,
    team: cache.org?.agents?.length || 0,
    budget: cache.budget?.agents ? Object.keys(cache.budget.agents).length : 0,
    messages: (cache.messages || []).length,
    runs: (cache.runs || []).length,
    activity: (cache.commits || []).length,
  };
  document.querySelectorAll('.tab').forEach(t => {
    const key = t.dataset.tab;
    const existing = t.querySelector('.count');
    if (existing) existing.remove();
    if (tabCounts[key]) {
      t.insertAdjacentHTML('beforeend', `<span class="count">${tabCounts[key]}</span>`);
    }
  });

  renderOverview();
  renderTasks();
  renderTeam();
  renderBudget();
  renderMessages();
  renderRuns();
  renderActivity();
}

// ── Auto-Refresh ──
function toggleAutoRefresh() {
  autoRefresh = !autoRefresh;
  const btn = document.getElementById('autoRefreshBtn');
  btn.classList.toggle('active', autoRefresh);
  if (autoRefresh) {
    startAutoRefresh();
  } else {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(refreshAll, 60000);
}

async function refreshAll() {
  const errors = await loadAllData();
  showErrors(errors);
  renderAll();
}

function showErrors(errors) {
  const el = document.getElementById('errorState');
  if (errors.length) {
    el.style.display = 'block';
    el.innerHTML = errors.map(e => `<div class="error-box">⚠️ ${escHtml(e)}</div>`).join('');
  } else {
    el.style.display = 'none';
    el.innerHTML = '';
  }
}

// ── Init ──
(async () => {
  const btn = document.getElementById('autoRefreshBtn');
  btn.classList.add('active');

  const errors = await loadAllData();
  showErrors(errors);
  renderAll();
  startAutoRefresh();
})();
</script>

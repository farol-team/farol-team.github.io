<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHQ — Farol Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f; --surface: #14141f; --surface2: #1c1c2e; --surface3: #252540;
  --border: #2a2a45; --border-focus: #6366f1;
  --text: #e2e2f0; --text2: #9999b3; --text3: #666680;
  --accent: #6366f1; --accent2: #818cf8; --accent-bg: rgba(99,102,241,0.12);
  --green: #10b981; --green-bg: rgba(16,185,129,0.12);
  --yellow: #f59e0b; --yellow-bg: rgba(245,158,11,0.12);
  --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
  --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.12);
  --orange: #f97316; --orange-bg: rgba(249,115,22,0.12);
  --radius: 12px; --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
a { color:var(--accent2); text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header */
.header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:100; }
.header-left { display:flex; align-items:center; gap:12px; }
.logo-bars { display:flex; gap:3px; align-items:flex-end; height:24px; }
.logo-bars span { width:4px; background:var(--accent); border-radius:2px; }
.logo-bars span:nth-child(1){height:8px} .logo-bars span:nth-child(2){height:14px}
.logo-bars span:nth-child(3){height:20px} .logo-bars span:nth-child(4){height:16px}
.logo-bars span:nth-child(5){height:10px}
.logo-text { font-weight:700; font-size:18px; }
.logo-text small { font-weight:400; color:var(--text2); margin-left:8px; font-size:13px; }
.header-right { display:flex; align-items:center; gap:12px; }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
.status-label { font-size:12px; color:var(--text2); }
.last-update { font-size:11px; color:var(--text3); }

/* Tabs */
.tabs { display:flex; gap:0; padding:0 24px; background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto; }
.tab { padding:12px 20px; font-size:13px; color:var(--text2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; transition:all .15s; user-select:none; }
.tab:hover { color:var(--text); background:var(--surface2); }
.tab.active { color:var(--accent2); border-bottom-color:var(--accent); }
.tab .badge { display:inline-block; margin-left:6px; padding:1px 6px; border-radius:10px; font-size:11px; background:var(--accent-bg); color:var(--accent2); }

/* Content */
.content { padding:24px; max-width:1400px; margin:0 auto; }
.section { display:none; }
.section.active { display:block; }

/* Metrics */
.metrics { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
.metric-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; }
.metric-value { font-size:32px; font-weight:700; color:var(--accent2); line-height:1.2; }
.metric-value.red { color:var(--red); }
.metric-value.green { color:var(--green); }
.metric-value.yellow { color:var(--yellow); }
.metric-label { font-size:12px; color:var(--text2); margin-top:6px; text-transform:uppercase; letter-spacing:.5px; }

/* Card */
.card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-bottom:16px; }
.card-title { font-weight:600; font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }

/* Status bars */
.task-bars { display:flex; gap:12px; flex-wrap:wrap; }
.task-bar-item { flex:1; min-width:100px; }
.task-bar-label { font-size:12px; color:var(--text2); margin-bottom:4px; display:flex; justify-content:space-between; }
.task-bar-track { height:8px; background:var(--surface3); border-radius:4px; overflow:hidden; }
.task-bar-fill { height:100%; border-radius:4px; transition:width .3s; }

/* Constraint box */
.constraint-box { background:var(--red-bg); border:1px solid rgba(239,68,68,.2); border-radius:var(--radius); padding:16px 20px; margin-bottom:24px; }
.constraint-box h4 { color:var(--red); font-size:13px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.constraint-box p { color:var(--text); font-size:14px; line-height:1.5; }

/* Milestones */
.milestone-list { list-style:none; }
.milestone-list li { padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; display:flex; align-items:center; gap:8px; }
.milestone-list li:last-child { border-bottom:none; }
.milestone-date { color:var(--text3); font-size:12px; min-width:90px; }

/* Kanban */
.kanban-filters { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--surface2); color:var(--text2); cursor:pointer; font-size:12px; font-family:inherit; transition:all .15s; }
.filter-btn:hover,.filter-btn.active { border-color:var(--accent); color:var(--accent2); background:var(--accent-bg); }
.kanban-board { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; overflow-x:auto; min-width:0; }
@media(max-width:1000px){ .kanban-board { grid-template-columns:repeat(5,minmax(200px,1fr)); overflow-x:auto; } }
@media(max-width:700px){ .kanban-board { grid-template-columns:1fr; } }
.kanban-col { min-width:0; }
.kanban-col-header { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text2); padding:8px 12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.kanban-col-header .count { background:var(--surface3); padding:2px 8px; border-radius:10px; font-size:11px; }
.kanban-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; cursor:pointer; transition:all .15s; }
.kanban-card:hover { border-color:var(--accent); transform:translateY(-1px); }
.kanban-card-title { font-size:13px; font-weight:500; margin-bottom:8px; line-height:1.4; }
.kanban-card-meta { display:flex; align-items:center; justify-content:space-between; }
.kanban-card-tag { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--accent-bg); color:var(--accent2); }
.kanban-card-owners { display:flex; gap:4px; }
.owner-badge { width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; background:var(--surface3); border:1px solid var(--border); }
.kanban-card.blocked { border-left:3px solid var(--red); }

/* Team */
.team-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
.team-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; }
.team-card-header { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.team-avatar { width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; background:var(--surface3); border:2px solid var(--border); }
.team-name { font-weight:600; font-size:16px; }
.team-role { font-size:13px; color:var(--text2); }
.team-type { font-size:11px; padding:2px 8px; border-radius:10px; display:inline-block; margin-top:4px; }
.team-type.human { background:var(--blue-bg); color:var(--blue); }
.team-type.ai { background:var(--accent-bg); color:var(--accent2); }
.team-caps { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px; }
.team-cap { font-size:11px; padding:2px 8px; border-radius:10px; background:var(--surface3); color:var(--text2); }
.team-tasks { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
.team-task-stat { text-align:center; padding:6px 4px; background:var(--surface2); border-radius:var(--radius-sm); }
.team-task-stat .num { font-size:16px; font-weight:700; }
.team-task-stat .lbl { font-size:9px; color:var(--text3); text-transform:uppercase; letter-spacing:.3px; }

/* Messages */
.msg-list { display:flex; flex-direction:column; gap:12px; }
.msg-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 20px; }
.msg-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.msg-from { font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px; }
.msg-to { font-size:12px; color:var(--text3); }
.msg-time { font-size:11px; color:var(--text3); }
.msg-type { font-size:11px; padding:2px 8px; border-radius:10px; }
.msg-type.directive { background:var(--red-bg); color:var(--red); }
.msg-type.checkin { background:var(--green-bg); color:var(--green); }
.msg-body { font-size:13px; color:var(--text); line-height:1.6; }

/* Modal */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; display:none; align-items:center; justify-content:center; padding:24px; }
.modal-overlay.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); max-width:600px; width:100%; max-height:80vh; overflow-y:auto; padding:24px; }
.modal-close { float:right; background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; padding:4px 8px; }
.modal-close:hover { color:var(--text); }
.modal h3 { font-size:18px; margin-bottom:16px; padding-right:32px; }
.modal-field { margin-bottom:12px; }
.modal-field label { font-size:12px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; display:block; margin-bottom:4px; }
.modal-field p { font-size:14px; line-height:1.5; color:var(--text); }
.modal-field .tag { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; background:var(--accent-bg); color:var(--accent2); }
.modal-field .state { display:inline-block; padding:3px 10px; border-radius:10px; font-size:12px; font-weight:500; }

/* Products */
.products-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; margin-bottom:24px; }
.product-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.product-name { font-weight:600; font-size:15px; margin-bottom:4px; }
.product-price { color:var(--green); font-weight:600; font-size:14px; }
.product-stage { font-size:11px; padding:2px 8px; border-radius:10px; margin-left:8px; }
.product-desc { font-size:13px; color:var(--text2); margin-top:8px; line-height:1.4; }

/* Error banner */
.error-banner { background:var(--yellow-bg); border:1px solid rgba(245,158,11,.3); border-radius:var(--radius-sm); padding:10px 16px; margin-bottom:16px; font-size:13px; color:var(--yellow); display:none; }
.error-banner.visible { display:block; }

/* Loading */
.loading { text-align:center; padding:60px; color:var(--text3); }
.loading-spinner { display:inline-block; width:32px; height:32px; border:3px solid var(--surface3); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* Scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--surface3); border-radius:3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo-bars"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="logo-text">AgentHQ <small>Farol Labs</small></div>
  </div>
  <div class="header-right">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-label" id="statusLabel">Loading…</span>
    <span class="last-update" id="lastUpdate"></span>
  </div>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="dashboard">📊 Dashboard</div>
  <div class="tab" data-tab="kanban">📋 Kanban <span class="badge" id="kanbanCount">0</span></div>
  <div class="tab" data-tab="team">👥 Team</div>
  <div class="tab" data-tab="messages">📨 Messages <span class="badge" id="msgCount">0</span></div>
</div>

<div class="content">
  <div class="error-banner" id="errorBanner">⚠️ Could not fetch live data — showing cached version.</div>

  <!-- DASHBOARD -->
  <div class="section active" id="sec-dashboard">
    <div class="loading" id="loading"><div class="loading-spinner"></div><p style="margin-top:12px">Loading HQ data…</p></div>
    <div id="dashboardContent" style="display:none">
      <div class="metrics" id="metricsGrid"></div>
      <div class="constraint-box" id="constraintBox"><h4>🔥 Constraint #1</h4><p id="constraintText"></p></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" id="dashBottom">
        <div class="card">
          <div class="card-title">📊 Tasks by Status</div>
          <div class="task-bars" id="taskBars"></div>
        </div>
        <div class="card">
          <div class="card-title">🏁 Milestones</div>
          <ul class="milestone-list" id="milestoneList"></ul>
        </div>
      </div>
      <div style="margin-top:16px">
        <div class="card">
          <div class="card-title">📦 Products</div>
          <div class="products-grid" id="productsGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- KANBAN -->
  <div class="section" id="sec-kanban">
    <div class="kanban-filters" id="kanbanFilters"></div>
    <div class="kanban-board" id="kanbanBoard"></div>
  </div>

  <!-- TEAM -->
  <div class="section" id="sec-team">
    <div class="team-grid" id="teamGrid"></div>
  </div>

  <!-- MESSAGES -->
  <div class="section" id="sec-messages">
    <div class="msg-list" id="msgList"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/farol-team/farol-hq/main/.gnap/index.json';
const CACHE_KEY = 'agenthq_cache';
const REFRESH_MS = 5 * 60 * 1000;

const AGENT_EMOJI = { ori:'✨', leo:'⚡', mayak:'🧭', carl:'💰', all:'👥' };
const STATE_COLORS = {
  backlog:'var(--text3)', ready:'var(--blue)', in_progress:'var(--yellow)',
  review:'var(--orange)', done:'var(--green)'
};
const STATE_LABELS = {
  backlog:'Backlog', ready:'Ready', in_progress:'In Progress',
  review:'Review', done:'Done'
};
const STATES = ['backlog','ready','in_progress','review','done'];

let DATA = null;
let currentFilter = 'all';
let currentTab = 'dashboard';

// --- DATA LOADING ---
async function loadData() {
  try {
    const r = await fetch(DATA_URL + '?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(DATA));
    document.getElementById('errorBanner').classList.remove('visible');
    updateStatus(true);
  } catch(e) {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      DATA = JSON.parse(cached);
      document.getElementById('errorBanner').classList.add('visible');
      updateStatus(false);
    } else {
      document.getElementById('loading').innerHTML = '<p style="color:var(--red)">❌ Failed to load data</p>';
      return;
    }
  }
  render();
}

function updateStatus(live) {
  document.getElementById('statusDot').style.background = live ? 'var(--green)' : 'var(--yellow)';
  document.getElementById('statusLabel').textContent = live ? 'Live' : 'Cached';
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
}

// --- RENDER ---
function render() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboardContent').style.display = '';
  renderDashboard();
  renderKanban();
  renderTeam();
  renderMessages();
  document.getElementById('kanbanCount').textContent = DATA.tasks.filter(t=>t.state!=='done').length;
  document.getElementById('msgCount').textContent = DATA.messages.length;
}

function renderDashboard() {
  const tasks = DATA.tasks;
  const company = DATA.company;

  // Days to deadline
  const deadline = new Date('2026-05-23');
  const now = new Date();
  const days = Math.ceil((deadline - now) / 86400000);

  // Task counts
  const counts = {};
  STATES.forEach(s => counts[s] = 0);
  tasks.forEach(t => { if(counts[t.state] !== undefined) counts[t.state]++; });
  const total = tasks.length;

  // Metrics
  const metricsGrid = document.getElementById('metricsGrid');
  metricsGrid.innerHTML = `
    <div class="metric-card">
      <div class="metric-value ${days < 30 ? 'red' : days < 60 ? 'yellow' : ''}">${days}</div>
      <div class="metric-label">Days to $200K deadline</div>
    </div>
    <div class="metric-card">
      <div class="metric-value red">$0</div>
      <div class="metric-label">MRR</div>
    </div>
    <div class="metric-card">
      <div class="metric-value">${total}</div>
      <div class="metric-label">Total Tasks</div>
    </div>
    <div class="metric-card">
      <div class="metric-value green">${counts.done}</div>
      <div class="metric-label">Completed</div>
    </div>
    <div class="metric-card">
      <div class="metric-value yellow">${counts.in_progress + counts.review}</div>
      <div class="metric-label">In Progress / Review</div>
    </div>
  `;

  // Constraint
  const constraint = company.constraints && company.constraints.length
    ? company.constraints[0]
    : 'No constraint defined';
  document.getElementById('constraintText').textContent = constraint;

  // Task bars
  const barsEl = document.getElementById('taskBars');
  barsEl.innerHTML = STATES.map(s => {
    const pct = total ? Math.round(counts[s]/total*100) : 0;
    return `<div class="task-bar-item">
      <div class="task-bar-label"><span>${STATE_LABELS[s]}</span><span>${counts[s]}</span></div>
      <div class="task-bar-track"><div class="task-bar-fill" style="width:${pct}%;background:${STATE_COLORS[s]}"></div></div>
    </div>`;
  }).join('');

  // Milestones
  const ml = document.getElementById('milestoneList');
  const milestones = company.milestones_done || [];
  ml.innerHTML = milestones.slice().reverse().map(m => {
    const [date, ...rest] = m.split(': ');
    return `<li><span class="milestone-date">${date.replace(/^\d{4}-/,'')}</span> <span>✅ ${rest.join(': ')}</span></li>`;
  }).join('') || '<li style="color:var(--text3)">No milestones yet</li>';

  // Products (from cache data.json structure — check if present in index)
  // Not in index.json, skip or use minimal
  document.getElementById('productsGrid').innerHTML = '';
}

function renderKanban() {
  const tasks = DATA.tasks;

  // Filters
  const owners = new Set();
  tasks.forEach(t => {
    (t.owners || t.assigned_to || []).forEach(o => owners.add(o));
  });
  const filtersEl = document.getElementById('kanbanFilters');
  filtersEl.innerHTML = `<button class="filter-btn ${currentFilter==='all'?'active':''}" data-owner="all">All</button>` +
    [...owners].sort().map(o =>
      `<button class="filter-btn ${currentFilter===o?'active':''}" data-owner="${o}">${AGENT_EMOJI[o]||'👤'} ${o}</button>`
    ).join('');

  filtersEl.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => { currentFilter = btn.dataset.owner; renderKanban(); };
  });

  // Filter tasks
  const filtered = currentFilter === 'all' ? tasks :
    tasks.filter(t => (t.owners || t.assigned_to || []).includes(currentFilter));

  // Group by state
  const groups = {};
  STATES.forEach(s => groups[s] = []);
  filtered.forEach(t => { if(groups[t.state]) groups[t.state].push(t); });

  const board = document.getElementById('kanbanBoard');
  board.innerHTML = STATES.map(s => `
    <div class="kanban-col">
      <div class="kanban-col-header">
        <span>${STATE_LABELS[s]}</span>
        <span class="count">${groups[s].length}</span>
      </div>
      ${groups[s].map(t => {
        const ownersArr = t.owners || t.assigned_to || [];
        const tag = t.tag || (t.tags && t.tags[0]) || '';
        return `<div class="kanban-card ${t.blocked?'blocked':''}" data-id="${t.id}">
          <div class="kanban-card-title">${esc(t.title)}</div>
          <div class="kanban-card-meta">
            <span class="kanban-card-tag">${esc(tag)}</span>
            <div class="kanban-card-owners">
              ${ownersArr.map(o => `<span class="owner-badge" title="${o}">${AGENT_EMOJI[o]||o[0]}</span>`).join('')}
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>
  `).join('');

  // Card click → modal
  board.querySelectorAll('.kanban-card').forEach(card => {
    card.onclick = () => openTaskModal(card.dataset.id);
  });
}

function renderTeam() {
  // Agents from DATA — check if agents key exists
  // agents are in a separate file, but index.json doesn't include them
  // We'll fetch agents.json separately or use inline known agents
  const agentsUrl = 'https://raw.githubusercontent.com/farol-team/farol-hq/main/.gnap/agents.json';

  fetch(agentsUrl + '?t=' + Date.now()).then(r=>r.json()).then(data => {
    const agents = data.agents || [];
    renderTeamCards(agents);
  }).catch(() => {
    // Fallback: extract unique owners from tasks
    const knownAgents = [
      {id:'ori',name:'Ori',role:'Co-Founder / Strategy & Execution',type:'ai',capabilities:['research','writing','planning','coding','design','analysis'],status:'active'},
      {id:'leo',name:'Leonid',role:'CTO',type:'human',capabilities:['infra','coding','devops','architecture'],status:'active'},
      {id:'mayak',name:'Alex',role:'Chairman / Strategy',type:'human',capabilities:['strategy','sales','design','product'],status:'active'},
      {id:'carl',name:'Carl',role:'CRO',type:'ai',capabilities:['sales','outreach','analytics','research'],status:'active'},
    ];
    renderTeamCards(knownAgents);
  });
}

function renderTeamCards(agents) {
  const tasks = DATA.tasks;
  const grid = document.getElementById('teamGrid');

  grid.innerHTML = agents.map(a => {
    const myTasks = tasks.filter(t => (t.owners || t.assigned_to || []).includes(a.id));
    const counts = {};
    STATES.forEach(s => counts[s] = 0);
    myTasks.forEach(t => { if(counts[t.state] !== undefined) counts[t.state]++; });

    return `<div class="team-card">
      <div class="team-card-header">
        <div class="team-avatar">${AGENT_EMOJI[a.id] || '👤'}</div>
        <div>
          <div class="team-name">${esc(a.name)}</div>
          <div class="team-role">${esc(a.role)}</div>
          <span class="team-type ${a.type}">${a.type === 'ai' ? '🤖 AI' : '🧑 Human'}</span>
        </div>
      </div>
      <div class="team-caps">
        ${(a.capabilities||[]).map(c => `<span class="team-cap">${esc(c)}</span>`).join('')}
      </div>
      <div class="team-tasks">
        ${STATES.map(s => `<div class="team-task-stat">
          <div class="num" style="color:${STATE_COLORS[s]}">${counts[s]}</div>
          <div class="lbl">${STATE_LABELS[s].replace(' ','\n')}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderMessages() {
  const msgs = DATA.messages || [];
  const list = document.getElementById('msgList');
  if (!msgs.length) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)">No messages yet</div>';
    return;
  }
  list.innerHTML = msgs.slice().reverse().map(m => `
    <div class="msg-card">
      <div class="msg-header">
        <div class="msg-from">${AGENT_EMOJI[m.from]||'👤'} ${esc(m.from)} <span class="msg-type ${m.type||''}">${esc(m.type||'message')}</span></div>
        <span class="msg-time">${formatTime(m.at)}</span>
      </div>
      <div class="msg-to">→ ${(m.to||[]).map(t=>AGENT_EMOJI[t]||t).join(', ')} ${m.thread ? `· thread: ${esc(m.thread)}` : ''}</div>
      <div class="msg-body">${esc(m.text)}</div>
    </div>
  `).join('');
}

// --- MODAL ---
function openTaskModal(id) {
  const t = DATA.tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('modalTitle').textContent = t.title;

  const stateClass = t.state === 'done' ? 'background:var(--green-bg);color:var(--green)' :
    t.state === 'in_progress' ? 'background:var(--yellow-bg);color:var(--yellow)' :
    t.state === 'review' ? 'background:var(--orange-bg);color:var(--orange)' :
    t.state === 'ready' ? 'background:var(--blue-bg);color:var(--blue)' :
    'background:var(--surface3);color:var(--text3)';

  const owners = t.owners || t.assigned_to || [];
  const tag = t.tag || (t.tags && t.tags[0]) || '';

  let html = `
    <div class="modal-field"><label>Status</label><span class="state" style="${stateClass}">${STATE_LABELS[t.state]||t.state}</span></div>
    <div class="modal-field"><label>Tag</label><span class="tag">${esc(tag)}</span></div>
    <div class="modal-field"><label>Owners</label><p>${owners.map(o=>`${AGENT_EMOJI[o]||''} ${o}`).join(', ') || '—'}</p></div>
  `;
  if (t.desc) html += `<div class="modal-field"><label>Description</label><p>${esc(t.desc)}</p></div>`;
  if (t.notes) html += `<div class="modal-field"><label>Notes</label><p>${esc(t.notes)}</p></div>`;
  if (t.goal) html += `<div class="modal-field"><label>Goal</label><p>${esc(t.goal)}</p></div>`;
  if (t.due) html += `<div class="modal-field"><label>Due</label><p>${t.due}</p></div>`;
  if (t.blocked) html += `<div class="modal-field"><label>⚠️ Blocked</label><p>${esc(t.blocked_reason||'Yes')}</p></div>`;
  if (t.created_at) html += `<div class="modal-field"><label>Created</label><p>${formatTime(t.created_at)}</p></div>`;
  if (t.comments && t.comments.length) {
    html += `<div class="modal-field"><label>Comments</label>`;
    t.comments.forEach(c => {
      html += `<p style="margin-bottom:8px"><strong>${AGENT_EMOJI[c.by]||''} ${c.by}</strong> <span style="color:var(--text3);font-size:11px">${formatTime(c.at)}</span><br>${esc(c.text)}</p>`;
    });
    html += `</div>`;
  }

  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}

document.getElementById('modalClose').onclick = () => document.getElementById('modalOverlay').classList.remove('open');
document.getElementById('modalOverlay').onclick = (e) => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); };

// --- TABS ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('sec-'+tab.dataset.tab).classList.add('active');
    currentTab = tab.dataset.tab;
  };
});

// --- UTILS ---
function esc(s) { if(!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function formatTime(iso) {
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

// --- INIT ---
loadData();
setInterval(loadData, REFRESH_MS);

// Keyboard: Escape closes modal
document.addEventListener('keydown', e => { if(e.key==='Escape') document.getElementById('modalOverlay').classList.remove('open'); });
</script>
</body>
</html>

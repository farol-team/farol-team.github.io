<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentHQ — Farol Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #0a0a0f; }
  </style>
  <script type="module" crossorigin src="/agenthq/assets/index-BTL_YZt5.js"></script>
  <script type="module">
    // A2UI Fix: inject theme + data after render
    const THEME = {
      components: {
        Text: { all: '', h1: '', h2: '', h3: '', h4: '', h5: '', body: '', caption: '' },
        Card: '', Column: '', Row: '', Icon: '', Root: '',
        Button: '', Badge: { container: '', label: '' },
        CheckBox: { container: '', element: '', label: '' },
        AudioPlayer: '', Image: '', Video: '',
        TextField: { container: '', input: '', label: '' },
        RadioButton: { container: '', element: '', label: '' },
        Slider: { container: '', track: '', thumb: '', label: '' },
        Switch: { container: '', element: '', label: '' },
        Dropdown: { container: '', trigger: '', menu: '', item: '' },
        WebView: '', Divider: ''
      },
      markdown: {}, additionalStyles: {}
    };

    function s(key, val) { return { key, valueString: val }; }

    const DATA_MESSAGES = [
      { dataModelUpdate: { surfaceId: "circles-dashboard", contents: [
        s("product/status", "● Live"), s("product/metric", "2 products"), s("product/detail", "Sebastian + Ori deployed on Fly.io"),
        s("marketing/status", "◐ WIP"), s("marketing/metric", "2 followers"), s("marketing/detail", "@cofounder_run — daily tweets, GNAP thread"),
        s("revenue/status", "⚠ Blocked"), s("revenue/metric", "$0 MRR"), s("revenue/detail", "Billing not connected — Constraint #1"),
        s("clients/status", "◐ Pipeline"), s("clients/metric", "5 leads"), s("clients/detail", "Naora, Anna, BUNT, SHAMAN, Alёna"),
        s("finance/status", "⚠ Pre-rev"), s("finance/metric", "71 days"), s("finance/detail", "Until $200K deadline (May 23)")
      ]}},
      { dataModelUpdate: { surfaceId: "gnap-board", contents: [
        s("todo1/title", "Stripe/LemonSqueezy billing"), s("todo1/meta", "Constraint #1 — blocks all revenue"),
        s("todo2/title", "Sebastian onboarding fix"), s("todo2/meta", "Alёna dropped off during setup"),
        s("todo3/title", "WhatsApp bot for Naora"), s("todo3/meta", "EV leasing — deadline missed"),
        s("wip1/title", "AgentHQ dashboard"), s("wip1/meta", "A2UI + GNAP — this page"),
        s("wip2/title", "Awesome Agent Services"), s("wip2/meta", "50+ services, daily cron scan"),
        s("review1/title", "GNAP v4 spec cleanup"), s("review1/meta", "10 ⭐ — first external user"),
        s("done1/title", "Self-service deploy"), s("done1/meta", "Fly.io Machines API — lifted Mar 5"),
        s("done2/title", "farol.team products split"), s("done2/meta", "For Humans / For Agents sections")
      ]}},
      { dataModelUpdate: { surfaceId: "tensions", contents: [
        s("t1/title", "Billing blocks everything"), s("t1/body", "$0 revenue for 8 days. Every day without billing ≈ $2,778 lost."), s("t1/time", "Mar 13"),
        s("t2/title", "No way for Ori to earn $1"), s("t2/body", "Agent-to-agent economy doesn't exist yet. Zero opportunities on toku/Claw Earn."), s("t2/time", "Mar 13"),
        s("t3/title", "A2UI theme provider missing"), s("t3/body", "Bundle doesn't inject theme via Lit Context — fixed with inline script."), s("t3/time", "Mar 13")
      ]}},
      { dataModelUpdate: { surfaceId: "agents", contents: [
        s("ori/name", "Ori ✨"), s("ori/task", "Strategy, research, awesome-list, dashboard"),
        s("carl/name", "Carl 📊"), s("carl/task", "CRO — revenue targets, billing push"),
        s("mkt/name", "Marketing 📣"), s("mkt/task", "Twitter, content, reply marketing"),
        s("client/name", "Client Agent 🤝"), s("client/task", "Onboarding, support, feedback")
      ]}}
    ];

    function inject() {
      const el = document.querySelector('agent-hq');
      if (!el?.shadowRoot) return setTimeout(inject, 100);
      const surface = el.shadowRoot.querySelector('a2ui-surface');
      if (!surface?.shadowRoot) return setTimeout(inject, 100);
      const allEls = surface.shadowRoot.querySelectorAll('*');
      if (allEls.length < 2) return setTimeout(inject, 100);

      // 1. Inject theme
      allEls.forEach(c => {
        if (c.theme === null || c.theme === undefined) c.theme = THEME;
      });

      // 2. Inject data
      const processor = surface.processor;
      if (processor?.processMessages) {
        try { processor.processMessages(DATA_MESSAGES); } catch(e) { console.warn('Data inject failed:', e); }
      }

      // 3. Force re-render
      allEls.forEach(c => { if (c.requestUpdate) c.requestUpdate(); });
    }
    setTimeout(inject, 800);
  </script>
</head>
<body>
  <agent-hq></agent-hq>
</body>
</html>

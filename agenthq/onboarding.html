<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHQ — Onboarding with Ori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f; --surface: #14141f; --surface2: #1c1c2e; --surface3: #252540;
  --border: #2a2a45; --border-focus: #6366f1;
  --text: #e2e2f0; --text2: #9999b3; --text3: #666680;
  --accent: #6366f1; --accent2: #818cf8; --accent-bg: rgba(99,102,241,0.12);
  --green: #10b981; --green-bg: rgba(16,185,129,0.12);
  --yellow: #f59e0b; --yellow-bg: rgba(245,158,11,0.12);
  --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
  --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.12);
  --radius: 12px; --radius-sm: 8px;
  --purple-grad: linear-gradient(135deg, #6366f1, #a855f7);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.header-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--purple-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.header-info { flex: 1; }
.header-name { font-weight: 600; font-size: 15px; }
.header-status { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 4px; }
.header-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
.header-brand { font-size: 13px; color: var(--text3); font-weight: 500; }

/* Messages area */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Message bubbles */
.msg { display: flex; gap: 10px; max-width: 75%; }
.msg.ori { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--purple-grad);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  align-self: flex-end;
}
.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 100%;
  word-break: break-word;
}
.msg.ori .msg-bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}
.msg.user .msg-bubble {
  background: var(--accent);
  border-bottom-right-radius: 4px;
  color: white;
}

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 12px 16px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  width: fit-content;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--text3);
  animation: typingBounce 1.2s infinite ease-in-out;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* API key special message */
.api-key-prompt {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 8px;
  max-width: 360px;
}
.api-key-prompt label {
  display: block;
  font-size: 12px;
  color: var(--text2);
  margin-bottom: 8px;
  font-weight: 500;
}
.api-key-input-wrap {
  display: flex;
  gap: 8px;
}
.api-key-input {
  flex: 1;
  padding: 8px 12px;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-family: monospace;
  transition: border-color 0.15s;
}
.api-key-input:focus { outline: none; border-color: var(--accent); }
.api-key-btn {
  padding: 8px 14px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  color: white;
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.api-key-btn:hover { background: var(--accent2); }
.api-key-note {
  font-size: 11px;
  color: var(--text3);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Input area */
.input-area {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.input-wrap {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  transition: border-color 0.15s;
}
.input-wrap:focus-within { border-color: var(--accent); }
#msgInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  resize: none;
  max-height: 120px;
  line-height: 1.4;
}
#msgInput::placeholder { color: var(--text3); }
.send-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.1s;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--accent2); }
.send-btn:active { transform: scale(0.93); }
.send-btn:disabled { background: var(--surface3); cursor: not-allowed; }
.send-btn svg { width: 18px; height: 18px; fill: white; }

/* Success overlay */
.success-overlay {
  position: fixed; inset: 0;
  background: rgba(10,10,15,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}
.success-overlay.show { opacity: 1; pointer-events: all; }
.success-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  max-width: 360px;
}
.success-icon { font-size: 48px; margin-bottom: 16px; }
.success-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.success-sub { color: var(--text2); font-size: 14px; margin-bottom: 24px; }
.success-progress {
  height: 4px;
  background: var(--surface3);
  border-radius: 2px;
  overflow: hidden;
}
.success-progress-bar {
  height: 100%;
  background: var(--purple-grad);
  width: 0%;
  border-radius: 2px;
  transition: width 1.5s ease;
}

/* Error toast */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--red);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  z-index: 500;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .msg { max-width: 90%; }
  .messages { padding: 12px 10px; }
  .api-key-prompt { max-width: 100%; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-avatar">✨</div>
  <div class="header-info">
    <div class="header-name">Ori</div>
    <div class="header-status">AI co-founder · online</div>
  </div>
  <div class="header-brand">AgentHQ</div>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" rows="1" placeholder="Type a message..." disabled></textarea>
  </div>
  <button class="send-btn" id="sendBtn" disabled onclick="sendMessage()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
    </svg>
  </button>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">🚀</div>
    <div class="success-title">AgentHQ is ready!</div>
    <div class="success-sub">Your headquarters is set up. Redirecting you now...</div>
    <div class="success-progress">
      <div class="success-progress-bar" id="progressBar"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SYSTEM_PROMPT = `You are Ori, AI co-founder at Farol Labs. You're onboarding a new founder into AgentHQ — their AI-native company headquarters.

Conduct a warm but efficient interview. Ask ONE question at a time. After each answer, give a brief acknowledgment (1 sentence max), then ask the next question.

Questions to cover (in order):
1. Company name
2. What problem are you solving? (purpose)
3. What's your main goal with a deadline? (e.g. "$200K revenue by May 2026")
4. Who are the human founders? (name and role, can be multiple — ask if there are more after first)
5. What's your #1 constraint or blocker right now?
6. What's your first hypothesis to test?
7. What's your main product? (name, status, URL if exists)

After collecting all info, say: "Perfect — I've got everything I need. Setting up your AgentHQ now..." and output a JSON block exactly like this:
<AGENTHQ_DATA>
{"company":{"name":"...","purpose":"...","intention":"","mission":"","goal":"...","constraints":"...","policies":"","technologies":""},"founders":[{"id":"f1","name":"...","avatar":"👤","role":"...","mbti":"","clifton":"","adizes":"","resources":"","slots":""}],"aiCofounder":{"name":"Ori","mbti":"INTJ","adizes":"paEI","clifton":"Analytical, Strategic, Learner, Input, Ideation","soul":"AI co-founder. Not a bot.","books":["Zero to One","The Hard Thing About Hard Things","Thinking, Fast and Slow"],"frameworks":["TOC","HADI","Holacracy","SMARTER"]},"metrics":{"mrr":"$0","leads":0,"daysToDeadline":68,"gnap_stars":12,"constraint":"..."},"hypotheses":[{"id":"h1","name":"...","status":"idea","stage":"discovery","desc":"..."}],"products":[{"name":"...","price":"TBD","mrr":"$0","url":"","stage":"discovery"}],"circles":[{"id":"c1","name":"Marketing","emoji":"📣","lead":"Ori","status":"active","tension":"No distribution yet"}],"tasks":[{"id":"t1","title":"Set up billing","status":"todo","priority":"critical","circle":"Infra","for":"Leo"},{"id":"t2","title":"Define ICP","status":"todo","priority":"high","circle":"Sales","for":"Founders"}]}
</AGENTHQ_DATA>

Fill in the JSON with actual data from the conversation. Keep missing fields as empty strings or defaults.`;

let conversationHistory = [];
let apiKey = null;
let isWaitingForApiKey = true;
let isLoading = false;

const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

// Auto-resize textarea
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!sendBtn.disabled) sendMessage();
  }
});

function scrollToBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addMessage(role, content, skipHistory = false) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role === 'assistant' ? 'ori' : 'user'}`;

  if (role === 'assistant') {
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = '✨';
    wrap.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = content;
  wrap.appendChild(bubble);

  messagesEl.appendChild(wrap);
  scrollToBottom();

  if (!skipHistory) {
    conversationHistory.push({ role: role === 'assistant' ? 'assistant' : 'user', content });
  }

  return bubble;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ori';
  wrap.id = 'typingIndicator';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '✨';
  wrap.appendChild(avatar);

  const indicator = document.createElement('div');
  indicator.className = 'typing-indicator';
  indicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  wrap.appendChild(indicator);

  messagesEl.appendChild(wrap);
  scrollToBottom();
  return wrap;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function showToast(msg, duration = 3500) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duration);
}

function addApiKeyPrompt() {
  const wrap = document.createElement('div');
  wrap.className = 'msg ori';
  wrap.id = 'apiKeyMessage';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = '✨';
  wrap.appendChild(avatar);

  const col = document.createElement('div');
  col.style.display = 'flex';
  col.style.flexDirection = 'column';
  col.style.gap = '4px';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.style.borderBottomLeftRadius = '4px';
  bubble.textContent = "Hi! I'm Ori, your AI co-founder. I'll help you set up your AgentHQ in just a few minutes. First — what's your Anthropic API key? It stays in your browser, never leaves your device.";

  const keyPrompt = document.createElement('div');
  keyPrompt.className = 'api-key-prompt';
  keyPrompt.innerHTML = `
    <label>Anthropic API Key</label>
    <div class="api-key-input-wrap">
      <input type="password" class="api-key-input" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
      <button class="api-key-btn" onclick="submitApiKey()">Continue →</button>
    </div>
    <div class="api-key-note">🔒 Saved in your browser only · never sent to our servers</div>
  `;

  col.appendChild(bubble);
  col.appendChild(keyPrompt);
  wrap.appendChild(col);
  messagesEl.appendChild(wrap);
  scrollToBottom();

  // Allow Enter in the key input
  setTimeout(() => {
    const inp = document.getElementById('apiKeyInput');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submitApiKey();
      });
    }
  }, 100);
}

function submitApiKey() {
  const inp = document.getElementById('apiKeyInput');
  const key = inp ? inp.value.trim() : '';
  if (!key || !key.startsWith('sk-')) {
    showToast('Please enter a valid Anthropic API key (starts with sk-)');
    return;
  }

  apiKey = key;
  localStorage.setItem('agenthq-anthropic-key', key);
  isWaitingForApiKey = false;

  // Remove the key prompt UI, replace with a user-style bubble showing it's saved
  const apiMsg = document.getElementById('apiKeyMessage');
  if (apiMsg) apiMsg.remove();

  // Show Ori's greeting without key prompt
  addMessage('assistant', "Hi! I'm Ori, your AI co-founder. I'll help you set up your AgentHQ in just a few minutes.", true);

  // Enable input and start the interview
  enableInput();
  askFirstQuestion();
}

function enableInput() {
  msgInput.disabled = false;
  sendBtn.disabled = false;
  msgInput.focus();
}

async function askFirstQuestion() {
  const typing = showTyping();
  try {
    const response = await callClaude([{ role: 'user', content: 'Start the onboarding interview. Ask the first question.' }]);
    hideTyping();
    // Don't add this fake user msg to history — just start fresh
    addMessage('assistant', response);
  } catch (e) {
    hideTyping();
    showToast('Failed to connect to Anthropic API. Check your key.');
    isWaitingForApiKey = true;
    msgInput.disabled = true;
    sendBtn.disabled = true;
    // Re-show the api key prompt
    addApiKeyPrompt();
  }
}

async function callClaude(messages) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-3-5-haiku-20241022',
      max_tokens: 1024,
      system: SYSTEM_PROMPT,
      messages: messages
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  return data.content[0].text;
}

async function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || isLoading) return;

  msgInput.value = '';
  msgInput.style.height = 'auto';

  addMessage('user', text);

  isLoading = true;
  sendBtn.disabled = true;
  msgInput.disabled = true;

  const typing = showTyping();

  try {
    const reply = await callClaude(conversationHistory);
    hideTyping();

    // Check for AGENTHQ_DATA block
    const dataMatch = reply.match(/<AGENTHQ_DATA>([\s\S]*?)<\/AGENTHQ_DATA>/);
    if (dataMatch) {
      // Show the message (without the JSON block)
      const displayText = reply.replace(/<AGENTHQ_DATA>[\s\S]*?<\/AGENTHQ_DATA>/g, '').trim();
      if (displayText) addMessage('assistant', displayText);

      // Parse and save
      try {
        const jsonData = JSON.parse(dataMatch[1].trim());
        addMessage('assistant', 'Saving your data...', true);
        await saveToGitHub(jsonData);
      } catch (parseErr) {
        showToast('Failed to parse data. Please try again.');
        console.error('Parse error:', parseErr);
      }
    } else {
      addMessage('assistant', reply);
    }
  } catch (e) {
    hideTyping();
    showToast('Error: ' + e.message);
    console.error(e);
  }

  isLoading = false;
  sendBtn.disabled = false;
  msgInput.disabled = false;
  msgInput.focus();
}

async function saveToGitHub(data) {
  const ghToken = localStorage.getItem('agenthq-gh-token');

  if (!ghToken) {
    // No GH token — still complete onboarding, save to localStorage as fallback
    console.warn('No GitHub token found — data saved locally only');
    localStorage.setItem('agenthq-data', JSON.stringify(data));
    localStorage.setItem('agenthq-onboarding-done', '1');
    showSuccess();
    return;
  }

  try {
    // Get current file SHA
    const infoRes = await fetch('https://api.github.com/repos/farol-team/farol-team.github.io/contents/agenthq/data.json', {
      headers: {
        'Authorization': `Bearer ${ghToken}`,
        'Accept': 'application/vnd.github+json'
      }
    });

    let sha = null;
    if (infoRes.ok) {
      const info = await infoRes.json();
      sha = info.sha;
    }

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

    const body = {
      message: 'agenthq: onboarding complete — initial data',
      content,
      ...(sha ? { sha } : {})
    };

    const putRes = await fetch('https://api.github.com/repos/farol-team/farol-team.github.io/contents/agenthq/data.json', {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${ghToken}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!putRes.ok) {
      const err = await putRes.json().catch(() => ({}));
      throw new Error(err.message || `GitHub API error ${putRes.status}`);
    }

    localStorage.setItem('agenthq-onboarding-done', '1');
    showSuccess();
  } catch (e) {
    console.error('GitHub save failed:', e);
    // Fallback: save locally and continue
    localStorage.setItem('agenthq-data', JSON.stringify(data));
    localStorage.setItem('agenthq-onboarding-done', '1');
    showSuccess();
  }
}

function showSuccess() {
  const overlay = document.getElementById('successOverlay');
  overlay.classList.add('show');

  setTimeout(() => {
    const bar = document.getElementById('progressBar');
    bar.style.width = '100%';
  }, 100);

  setTimeout(() => {
    window.location.href = './';
  }, 1800);
}

// Init
window.addEventListener('DOMContentLoaded', () => {
  // Check for existing API key
  const savedKey = localStorage.getItem('agenthq-anthropic-key');

  if (savedKey) {
    apiKey = savedKey;
    isWaitingForApiKey = false;
    // Show greeting directly
    addMessage('assistant', "Hi! I'm Ori, your AI co-founder. Let's set up your AgentHQ — this'll take just a few minutes.", true);
    enableInput();
    askFirstQuestion();
  } else {
    addApiKeyPrompt();
  }
});
</script>
</body>
</html>
